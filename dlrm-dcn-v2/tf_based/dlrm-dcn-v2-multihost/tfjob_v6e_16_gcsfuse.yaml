apiVersion: kubeflow.org/v1
kind: TFJob
metadata:
  name: ${TFJOB_NAME}
spec:
  runPolicy:
    cleanPodPolicy: Running
    ttlSecondsAfterFinished: 600
  tfReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: ExitCode
      template:
        metadata:
          labels:
            app: tfjob
          annotations:
            gke-gcsfuse/volumes: "true"
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: dlrm-job-sa
          volumes:
            - name: gcs-fuse-volume
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: ${GCS_BUCKET_NAME}
                  mountOptions: "implicit-dirs,file-cache:max-size-mb:-1,file-cache:enable-parallel-downloads:true,read_ahead_kb=1024,metadata-cache:ttl-secs:-1"
          containers:
            - name: tensorflow
              volumeMounts:
                - name: gcs-fuse-volume
                  mountPath: /gcs
              command: ["/usr/local/bin/entrypoint.sh"]
              image: ${UNIFIED_IMAGE_URL}
              imagePullPolicy: Always
              env:
                - name: TPU_WORKER_HOSTNAMES
                  value: "${TFJOB_NAME}-worker-0.default.svc,${TFJOB_NAME}-worker-1.default.svc,${TFJOB_NAME}-worker-2.default.svc,${TFJOB_NAME}-worker-3.default.svc"
                - name: LIBTPU_INIT_ARGS
                  value: "--xla_tpu_embedding_table_oblongness_threshold=inf --copy_with_dynamic_shape_op_output_pjrt_buffer=true"
                - name: TF_JOB_PACKAGE_URIS
                  value: ""
              resources: {}
    Worker:
      replicas: 4
      restartPolicy: ExitCode
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
            sidecar.istio.io/inject: "false"
          labels:
            app: tfjob
        spec:
          serviceAccountName: dlrm-job-sa
          volumes:
            - name: gcs-fuse-volume
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: ${GCS_BUCKET_NAME}
                  mountOptions: "implicit-dirs"
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
            cloud.google.com/gke-tpu-topology: 4x4
          tolerations:
            - effect: NoSchedule
              key: dedicated
              operator: Equal
              value: tfjob
            - effect: NoSchedule
              key: google.com/tpu
              operator: Equal
              value: present
          containers:
            - name: tensorflow
              volumeMounts:
                - name: gcs-fuse-volume
                  mountPath: /gcs
              command: ["/usr/local/bin/tpu_tfjob_worker.sh"]
              env:
                - name: LIBTPU_INIT_ARGS
                  value: "--xla_tpu_embedding_table_oblongness_threshold=inf --copy_with_dynamic_shape_op_output_pjrt_buffer=true"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: TPU_WORKER_HOSTNAMES
                  value: "${TFJOB_NAME}-worker-0.default.svc,${TFJOB_NAME}-worker-1.default.svc,${TFJOB_NAME}-worker-2.default.svc,${TFJOB_NAME}-worker-3.default.svc"
                - name: HOSTNAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['training.kubeflow.org/replica-index']
              image: ${UNIFIED_IMAGE_URL}
              imagePullPolicy: Always
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
