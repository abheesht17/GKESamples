apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tpu-inference-route
  namespace: vllm-tpu-ns
spec:
  parentRefs:
  - name: internal-gateway
    namespace: default
  rules:
  - matches:
    - headers:
      - type: Exact
        name: X-Gateway-Model-Name
        value: "/data/lama3model-bucket/Llama-3.1-8B-Instruct"
      path:
        type: PathPrefix
        value: /v1/completions
    backendRefs:
    - name: vllm-tpu-inferencepool
      group: "inference.networking.k8s.io"
      kind: InferencePool
      port: 8000