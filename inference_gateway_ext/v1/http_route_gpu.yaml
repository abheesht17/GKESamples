apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: main-inference-routes
spec:
  parentRefs:
  - name: internal-gateway
  rules:
  - matches:
    - headers:
      - type: Exact
        name: X-Gateway-Model-Name
        value: "meta-llama/Llama-3.1-8B-Instruct"
    backendRefs:
    - name: vllm-llama3-8b-instruct
      group: "inference.networking.k8s.io"
      kind: InferencePool
      weight: 0
    - name: vllm-llama3-8b-canary-pool
      group: "inference.networking.k8s.io"
      kind: InferencePool
      weight: 100
  - matches:
    - headers:
      - type: Exact
        name: X-Gateway-Model-Name
        value: "/data/lama3model-bucket/Llama-3.1-70B-Instruct"
    backendRefs:
    - name: vllm-70b-lws-pool
      group: "inference.networking.k8s.io"
      kind: InferencePool
